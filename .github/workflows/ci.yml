name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint
        run: uv run ruff check reverie tests
      - name: Types
        run: uv run mypy reverie
      - name: Tests (mock provider only; no API key in CI)
        env:
          ANTHROPIC_API_KEY: ""
        run: uv run pytest --cov=reverie --cov-report=term-missing
