[project]
name = "reverie"
version = "0.1.0"
description = "An open-source dreaming engine for coding-agent memory: turns past agent sessions into an evidence-backed, size-capped memory repository."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "reverie contributors" }]
keywords = ["agents", "memory", "claude-code", "llm", "dreaming"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "platformdirs>=4.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Harbor is only needed to run reverie as a FrontierMemory memory-generation agent.
frontiermemory = ["harbor[modal]==0.24.0"]

[project.scripts]
reverie = "reverie.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reverie"]

[tool.hatch.build.targets.sdist]
include = ["reverie", "tests", "docs", "examples", "integrations", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: longer end-to-end tests",
]

[tool.coverage.run]
source = ["reverie"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM108", "RUF012", "SIM105", "RUF005", "SIM102"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "reverie.core.*"
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[[tool.mypy.overrides]]
module = "reverie.adapters.frontiermemory.agent"
ignore_errors = true
